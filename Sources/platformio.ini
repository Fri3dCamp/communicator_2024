[env]
platform = ch32v
; add "-D DEBUG=2" if you want to configure the UART as debug output
build_flags = -I. -Isrc
framework = noneos-sdk
upload_protocol = isp
extra_scripts =
    pre:git_version.py

[env:genericCH32V203G6U6]
board = genericCH32V203G6U6
board_build.clock_source = hsi+pll
board_build.f_cpu = 48000000L
board_build.use_builtin_debug_code = no
